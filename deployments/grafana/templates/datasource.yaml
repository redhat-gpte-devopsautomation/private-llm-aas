apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: user-workload-monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  valuesFrom:
    - targetPath: secureJsonData.httpHeaderValue1
      valueFrom:
        secretKeyRef:
          name: grafana-auth-secret
          key: token
  instanceSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
  datasource:
    access: proxy
    database: prometheus
    isDefault: true
    jsonData:
      httpHeaderName1: Authorization
      timeInterval: 5s
      tlsSkipVerify: true
    secureJsonData:
      httpHeaderValue1: Bearer ${token}
    name: Prometheus
    # Fixed uid so dashboards can reference this datasource directly.
    # Dashboards applied via GrafanaDashboard CRs get no import step, so the
    # ${DS_PROMETHEUS}/__inputs pattern never resolves and panels stay empty.
    uid: prometheus
    type: prometheus
    url: https://thanos-querier.openshift-monitoring.svc:9091
